# ===================================================================
# CẤU HÌNH HỆ THỐNG BACKEND - ĐỒ ÁN CNPM (HCMUTE)
# ===================================================================

# 1. Cấu hình Cổng chạy Backend (Mặc định là 8080)
server.port=8080

# 2. Tên ứng dụng
spring.application.name=used-car-backend

# ===================================================================
# 3. CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU POSTGRESQL
# ===================================================================
# Đường dẫn kết nối: jdbc:postgresql://<địa_chỉ_host>:<port>/<tên_database>
# Cú pháp ${BIEN_MOI_TRUONG:gia_tri_mac_dinh} giúp vừa chạy được trên máy cá nhân,
# vừa linh hoạt khi chạy bằng Docker mà không bị lỗi.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:used_car_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# 4. CẤU HÌNH JPA / HIBERNATE (TỰ ĐỘNG TẠO BẢNG TỪ JAVA)
# ===================================================================
# ddl-auto=update: Tự động tạo bảng hoặc thêm cột vào CSDL nếu trong code Java có thay đổi
spring.jpa.hibernate.ddl-auto=update

# show-sql=true: Hiển thị các câu lệnh SQL dưới Console khi chạy để dễ theo dõi/debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Không bắt buộc phải kết nối DB thành công ngay khi ứng dụng khởi động (nếu DB chưa bật)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# 5. CẤU HÌNH SWAGGER UI (GIAO DIỆN XEM VÀ TEST API TRÊN WEB)
# ===================================================================
# Truy cập giao diện tại: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
